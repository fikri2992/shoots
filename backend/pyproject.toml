[project]
name = "shoots"
version = "0.1.0"
description = "Shoots learns from every Shot, offers one personal Experiment, and tracks what changes"
requires-python = ">=3.12"
dependencies = [
    # Upper bound on purpose: SequentialAgent and ParallelAgent, which are the
    # Analyst's whole skeleton, carry @deprecated in 2.7.1 and say they will be
    # removed. An unbounded pin lets a sync delete the panel.
    "google-adk>=2.7,<3",
    "google-genai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pillow>=11.0.0",
    # Phase correlation for camera-move measurement (imaging/motion.py) and the
    # single-pass colour/tone statistics (imaging/tone.py).
    "numpy>=2.0.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-storage>=2.18.0",
    "google-cloud-pubsub>=2.25.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-api-python-client>=2.150.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.0",
    "authlib>=1.3.0",
    "itsdangerous>=2.2.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "pywebpush>=2.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency idiom is `param = Depends(...)`; B008 would forbid it.
"app/api/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
