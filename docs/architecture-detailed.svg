<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Shoots detailed multi-agent architecture on Google Cloud</title>
  <desc id="desc">The Photographer captures a Shot with the system Camera. The Android Phone Source uploads it to a Cloud Run API, which creates a durable Run and delivers independently retryable stages through Pub/Sub. ADK runs the Analyst sequence and its parallel image readers. Code validates every model result, owns barriers and routing, and settles one Shoot Record. A code-gated Scout policy may invoke a grounded Scout writer. Firestore, Cloud Storage, Drive, FCM, identity, read models, and Cloud Logging form the service plane.</desc>
