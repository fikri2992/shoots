      .return{stroke:#3c4043;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .data{stroke:#5f6368;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#arrow)}
      .tool{stroke:#f29900;stroke-width:2.4;fill:none;stroke-dasharray:5 5;marker-end:url(#arrowGold)}
