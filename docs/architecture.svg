  <text class="h3" x="346" y="53">System Camera</text><text class="small" x="346" y="75">Photographer controls shutter</text>
  <rect class="external" x="620" y="20" width="250" height="76" rx="9"/>
  <text class="h3" x="646" y="53">Android Phone Source</text><text class="small" x="646" y="75">detects Camera media · uploads in background</text>
  <rect class="external" x="950" y="20" width="220" height="76" rx="9"/>
  <text class="h3" x="976" y="53">Web audit desk</text><text class="small" x="976" y="75">same Photographer record</text>
