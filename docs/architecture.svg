<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Shoots autonomous learning workflow on Google Cloud</title>
  <desc id="desc">A Photographer takes ordinary Shots with the system Camera. Android Phone Source detects new Camera media and uploads it without another user step. Pub/Sub connects independently retryable code stages, while ADK parallel and sequential agents run in process inside the Analyst stage. The stacked per-Shot lane repeats for every media item. Settled Runs visibly converge at a Shoot barrier before one Shoot synthesis, code-gated Scout decision, and Shoot Record. A short conditional branch reaches the Scout writer and Google Search. Firestore and Cloud Storage retain the work. Read models return the receipt to Android and web, while FCM reaches Android only. The loop ends with useful learning work back in the Photographer's hands.</desc>
  <defs>
    <style>
      text{font-family:Inter,Roboto,"Segoe UI",Arial,sans-serif;fill:#202124}
      .bg{fill:#fff}.cloud{fill:#4285f4;stroke:#275db2;stroke-width:2}.region{fill:#fff;stroke:#3c4043;stroke-width:1.6}
      .external{fill:#fff;stroke:#5f6368;stroke-width:1.7}.workflow{fill:#dff3e5;stroke:#4d6655;stroke-width:1.8}
      .code{fill:#fff;stroke:#4285f4;stroke-width:2.2}.agent{fill:#fff;stroke:#f29900;stroke-width:2.2}
      .artifact{fill:#fff;stroke:#34a853;stroke-width:2.2}.service-area{fill:#e8f0fe;stroke:#5f6368;stroke-width:1.7;stroke-dasharray:7 5}
      .delivery{fill:#eef8f1;stroke:#34a853;stroke-width:2}.service{fill:#fff;stroke:#5f6368;stroke-width:1.7}
