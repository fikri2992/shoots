  <text class="h" x="910" y="228">Shoot lifecycle</text>
  <text class="t" x="910" y="255">capture continuity</text>
  <text class="t" x="910" y="276">revisioned late media</text>
  <rect class="barrier" x="1095" y="205" width="165" height="75" rx="14"/>
  <text class="h" x="1118" y="235">SHOOT BARRIER</text>
  <text class="small" x="1118" y="258">every current Run</text>
  <rect class="terminal" x="885" y="335" width="375" height="110" rx="18"/>
  <text class="h" x="910" y="370">Settled Shoot Record</text>
  <text class="t" x="910" y="397">exact members · repeated · varied · blind spots</text>
  <text class="t" x="910" y="421">provenance · typed Scout outcome · audit trail</text>
  <rect class="code" x="885" y="505" width="180" height="125" rx="16"/>
  <text class="h" x="910" y="538">Memory projections</text>
  <text class="t" x="910" y="565">Technique Map</text>
  <text class="t" x="910" y="587">Tendency + Journey</text>
  <text class="t" x="910" y="609">Intervention outcome</text>
  <rect class="code" x="1095" y="505" width="165" height="125" rx="16"/>
  <text class="h" x="1120" y="538">Scout policy</text>
  <text class="t" x="1120" y="565">explain · ask</text>
  <text class="t" x="1120" y="587">Explore · Reproduce</text>
  <text class="t" x="1120" y="609">or evidenced silence</text>
  <rect class="barrier" x="1095" y="695" width="165" height="75" rx="14"/>
  <text class="h" x="1115" y="725">BATCH BARRIER</text>
  <text class="small" x="1118" y="748">committed members</text>
  <rect class="terminal" x="885" y="690" width="180" height="120" rx="18"/>
