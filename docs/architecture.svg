      .t{font-size:14px}.small{fill:#5f6368;font-size:12px}.tiny{fill:#5f6368;font-size:11px}.label{font-size:14px;font-weight:650}.eyebrow{font-size:13px;font-weight:750;letter-spacing:.55px}
      .arrow{stroke:#3c4043;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.event{stroke:#4285f4;stroke-width:2.5;fill:none;marker-end:url(#arrowBlue)}
      .data{stroke:#5f6368;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#arrow)}
      .merge{stroke:#5f6368;stroke-width:2;fill:none}.tool{stroke:#f29900;stroke-width:2.3;fill:none;stroke-dasharray:5 5;marker-end:url(#arrowGold)}
      .deliver{stroke:#34a853;stroke-width:2.5;fill:none;marker-end:url(#arrowGreen)}.notice{stroke:#4285f4;stroke-width:2.2;fill:none;marker-end:url(#arrowBlue)}
