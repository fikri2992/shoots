  <use href="#braces" x="92" y="283" width="29" height="29"/><text class="h3" x="137" y="281">Cloud Run API</text><text class="t" x="137" y="307">creates Shot + durable Run atomically</text><text class="small" x="137" y="328">identity · upload · authenticated reads</text>
