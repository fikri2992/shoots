<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Shoots continuous agent architecture</title>
  <desc id="desc">Phone Camera media becomes durable Shot Runs, one revisioned Shoot Record, bounded longitudinal memory, a typed Scout decision, optional Experiments, and native Android or web artifacts. Capture Session, Run, and Shoot barriers remain independent.</desc>
  <defs>
    <style>
      .bg{fill:#11110f}.lane{fill:#181713;stroke:#353126;stroke-width:2}.box{fill:#211f19;stroke:#5a5240;stroke-width:2}.code{fill:#182126;stroke:#4d8295;stroke-width:2}.model{fill:#2a2114;stroke:#d89a3b;stroke-width:2}.person{fill:#1b251d;stroke:#75a67c;stroke-width:2}.external{fill:#1e1e1d;stroke:#77736b;stroke-width:2}.terminal{fill:#2a2419;stroke:#e2b55c;stroke-width:3}.title{fill:#f4efe3;font:700 34px system-ui,sans-serif}.subtitle{fill:#afa99c;font:18px system-ui,sans-serif}.laneTitle{fill:#d8d1c2;font:700 18px system-ui,sans-serif;letter-spacing:1px}.h{fill:#f5efe2;font:700 18px system-ui,sans-serif}.t{fill:#c8c0b2;font:15px system-ui,sans-serif}.small{fill:#a9a294;font:13px system-ui,sans-serif}.label{fill:#d4cdbf;font:13px system-ui,sans-serif}.arrow{stroke:#8a8377;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.amberArrow{stroke:#d89a3b;stroke-width:3;fill:none;marker-end:url(#arrowAmber)}.dash{stroke:#8a8377;stroke-width:2;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}.barrier{fill:#11110f;stroke:#d89a3b;stroke-width:2}.legend{font:14px system-ui,sans-serif;fill:#c8c0b2}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8a8377"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d89a3b"/></marker>
  </defs>

  <rect class="bg" width="1600" height="1000"/>
  <text class="title" x="48" y="58">Shoots turns ordinary Camera activity into finished learning work</text>
  <text class="subtitle" x="48" y="88">One Shot Run. Three independent barriers. One correctable Photographer record.</text>

