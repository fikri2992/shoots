      .label-bg{fill:#fff;stroke:#dadce0;stroke-width:1}.step{fill:#188038}.step-text{fill:#fff;font-size:14px;font-weight:750}
      .robot{fill:none;stroke:#f29900;stroke-width:2}.code-icon{fill:none;stroke:#4285f4;stroke-width:2}.store-icon{fill:none;stroke:#5f6368;stroke-width:2}
      .dot-agent{fill:#f29900}.dot-code{fill:#4285f4}.dot-artifact{fill:#34a853}
    </style>
