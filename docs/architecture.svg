  <circle class="dot-code" cx="359" cy="577" r="5"/><text class="small" x="372" y="582">Cartographer</text>
  <circle class="dot-code" cx="359" cy="603" r="5"/><text class="small" x="372" y="608">Judge</text>
  <circle class="dot-code" cx="359" cy="629" r="5"/><text class="small" x="372" y="634">Scribe</text>
