  <text class="t" x="365" y="390">EXIF, Tone, Motion</text>
  <text class="t" x="365" y="412">grid + display assets</text>
  <rect class="model" x="590" y="330" width="215" height="105" rx="16"/>
  <text class="h" x="615" y="363">Analyst panel</text>
  <text class="t" x="615" y="390">3 disjoint lenses</text>
  <text class="t" x="615" y="412">schema + taxonomy bound</text>
  <rect class="code" x="340" y="490" width="205" height="105" rx="16"/>
  <text class="h" x="365" y="523">Cartographer</text>
  <text class="t" x="365" y="550">Technique evidence axes</text>
  <text class="t" x="365" y="572">rebuildable projections</text>
  <rect class="code" x="590" y="490" width="215" height="105" rx="16"/>
  <text class="h" x="615" y="523">Judge, Reproduce only</text>
  <text class="t" x="615" y="550">Criteria or abstention</text>
  <text class="t" x="615" y="572">Never grades the Shot</text>
  <rect class="code" x="340" y="650" width="205" height="105" rx="16"/>
  <text class="h" x="365" y="683">Teaching Receipt</text>
  <text class="t" x="365" y="710">Keep · Notice · Try · Check</text>
  <text class="t" x="365" y="732">one image layer</text>
  <rect class="code" x="590" y="650" width="215" height="105" rx="16"/>
  <text class="h" x="615" y="683">Scribe</text>
  <text class="t" x="615" y="710">reviewed output</text>
  <text class="t" x="615" y="732">Deconstruction attempt</text>

