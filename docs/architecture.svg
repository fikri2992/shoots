  <rect class="artifact" x="995" y="535" width="70" height="80" rx="8"/>
  <text class="label" x="1030" y="558" text-anchor="middle">Shoot</text><text class="label" x="1030" y="577" text-anchor="middle">Record</text><text class="tiny" x="1030" y="599" text-anchor="middle">finished</text>
  <path class="arrow" d="M805 575 H835"/><path class="arrow" d="M940 575 H995"/>
  <path class="merge" d="M988 515 H967 V558"/>
  <circle class="step" cx="967" cy="575" r="17"/><text class="step-text" x="967" y="580" text-anchor="middle">4</text>
