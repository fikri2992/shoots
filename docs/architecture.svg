  <rect class="lane" x="315" y="120" width="520" height="780" rx="24"/>
  <rect class="lane" x="860" y="120" width="430" height="780" rx="24"/>
  <rect class="lane" x="1315" y="120" width="245" height="780" rx="24"/>
  <text class="laneTitle" x="65" y="155">EVENT SOURCES</text>
  <text class="laneTitle" x="340" y="155">ONE SHOT</text>
  <text class="laneTitle" x="885" y="155">ONE SHOOT</text>
  <text class="laneTitle" x="1340" y="155">PHOTOGRAPHER</text>

  <rect class="external" x="70" y="185" width="190" height="80" rx="16"/>
  <text class="h" x="95" y="218">Normal Camera</text>
  <text class="t" x="95" y="244">Photographer owns shutter</text>
  <rect class="code" x="70" y="305" width="190" height="105" rx="16"/>
  <text class="h" x="95" y="338">Phone Source</text>
  <text class="t" x="95" y="365">MediaStore + Room</text>
  <text class="t" x="95" y="387">WorkManager outbox</text>
  <rect class="external" x="70" y="450" width="190" height="80" rx="16"/>
  <text class="h" x="95" y="483">Drive, optional</text>
  <text class="t" x="95" y="508">Explicit import / output</text>
  <rect class="person" x="70" y="570" width="190" height="105" rx="16"/>
  <text class="h" x="95" y="603">Photographer signals</text>
  <text class="t" x="95" y="630">Keeper, Intent, role</text>
  <text class="t" x="95" y="652">correction, preference</text>
  <rect class="code" x="70" y="715" width="190" height="105" rx="16"/>
  <text class="h" x="95" y="748">Capture Session</text>
  <text class="t" x="95" y="775">Frozen Experiment batch</text>
  <text class="t" x="95" y="797">Never inferred from time</text>

