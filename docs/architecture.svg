  <rect class="service" x="960" y="650" width="105" height="30" rx="14"/><text class="tiny" x="1012" y="669" text-anchor="middle">Google Search</text>
  <path class="tool" d="M945 665 H960"/>

  <path class="event" d="M560 345 V370 H45 V590 H80"/>
  <use href="#envelope" x="51" y="578" width="24" height="24"/>
  <circle class="step" cx="560" cy="370" r="18"/><text class="step-text" x="560" y="375" text-anchor="middle">3</text>
  <rect class="label-bg" x="584" y="358" width="154" height="25" rx="12"/><text class="small" x="661" y="375" text-anchor="middle">Pub/Sub stage boundary</text>
  <rect class="label-bg" x="80" y="748" width="460" height="28" rx="14"/>
  <use href="#envelope" x="94" y="751" width="22" height="22"/><text class="small" x="126" y="767">independent retry · idempotent consumer · replay-safe write</text>
  <circle cx="1000" cy="405" r="4" fill="#5f6368"/>
  <path class="data" d="M1000 405 V380 H1220 V300 H1240"/>
  <rect class="label-bg" x="1090" y="349" width="110" height="24" rx="12"/><text class="small" x="1145" y="365" text-anchor="middle">model calls</text>

  <!-- State and delivery -->
  <rect class="service-area" x="1140" y="405" width="390" height="180" rx="10"/>
  <text class="h2" x="1165" y="442">Durable state + proof</text>
  <ellipse class="store-icon" cx="1178" cy="475" rx="14" ry="7"/><path class="store-icon" d="M1164 475v22c0 4 6 7 14 7s14-3 14-7v-22M1164 487c0 4 6 7 14 7s14-3 14-7"/>
  <text class="h3" x="1210" y="480">Firestore</text><text class="small" x="1305" y="480">Run · Shoot Record</text>
  <path d="M1165 502 H1505" stroke="#dadce0" stroke-width="1"/>
  <text class="h3" x="1165" y="527">Cloud Storage</text><text class="small" x="1305" y="527">original media · display assets</text>
  <path d="M1165 544 H1505" stroke="#dadce0" stroke-width="1"/>
  <text class="h3" x="1165" y="568">Cloud Logging</text><text class="small" x="1305" y="568">stages · retries · revision evidence</text>

  <path class="data" d="M1065 575 H1110 V485 H1140"/>
  <circle class="step" cx="1110" cy="485" r="18"/><text class="step-text" x="1110" y="490" text-anchor="middle">5</text>
  <rect class="label-bg" x="1015" y="448" width="120" height="24" rx="12"/><text class="small" x="1075" y="464" text-anchor="middle">persist receipt</text>

  <rect class="delivery" x="1140" y="615" width="390" height="145" rx="10"/>
  <text class="h2" x="1165" y="650">Value delivered to Photographer</text>
  <circle class="dot-artifact" cx="1170" cy="680" r="6"/><text class="h3" x="1188" y="686">Read models</text>
  <text class="small" x="1188" y="708">Shoot receipt → Android Now / Journey + web audit</text>
  <circle class="dot-code" cx="1170" cy="733" r="6"/><text class="h3" x="1188" y="739">FCM</text><text class="small" x="1235" y="739">Capture Session + Experiment notices → Android</text>
  <path class="arrow" d="M1335 585 V615"/>

  <!-- Closed user-value loop: reads reach both clients, FCM reaches Android only -->
  <path class="deliver" d="M1530 690 H1555 V112 H1070 C1067 104 1053 104 1050 112 H755 C752 104 738 104 735 112 H705 V96"/>
  <path class="deliver" d="M1025 112 V96"/>
  <path class="notice" d="M1530 735 H1540 V132 H1070 C1067 124 1053 124 1050 132 H835 V96"/>
  <circle class="step" cx="1260" cy="112" r="18"/><text class="step-text" x="1260" y="117" text-anchor="middle">6</text>
  <rect class="label-bg" x="1284" y="100" width="180" height="25" rx="12"/><text class="small" x="1374" y="117" text-anchor="middle">Shoot receipt delivered</text>
  <rect class="label-bg" x="900" y="120" width="118" height="24" rx="12"/><text class="small" x="959" y="136" text-anchor="middle">FCM notice</text>

  <!-- Runtime and list legend -->
  <text class="label" x="70" y="820">Runtime</text><text class="t" x="136" y="820">Cloud Run · Pub/Sub · ADK · Gemini · Search · Firestore · Cloud Storage · FCM · Cloud Logging</text>
  <rect class="service" x="70" y="842" width="1460" height="160" rx="10"/>
  <text class="h3" x="92" y="872">Legend</text>
  <text class="label" x="92" y="900">Node types</text>
  <rect class="code" x="92" y="913" width="22" height="22" rx="4"/><text class="small" x="126" y="929">Deterministic code</text>
  <rect class="agent" x="92" y="943" width="22" height="22" rx="4"/><text class="small" x="126" y="959">Model-backed agent</text>
  <rect class="artifact" x="92" y="973" width="22" height="22" rx="4"/><text class="small" x="126" y="989">Durable artifact</text>

  <text class="label" x="560" y="900">Connections</text>
  <line class="line-solid" x1="560" y1="921" x2="615" y2="921"/><text class="small" x="628" y="926">Direct call or in-process ADK</text>
  <line class="line-event" x1="560" y1="951" x2="615" y2="951"/><use href="#envelope" x="575" y="939" width="24" height="24"/><text class="small" x="628" y="956">Pub/Sub stage boundary</text>
  <line class="line-data" x1="900" y1="921" x2="955" y2="921"/><text class="small" x="968" y="926">State or conditional route</text>
  <line class="line-tool" x1="900" y1="951" x2="955" y2="951"/><text class="small" x="968" y="956">Scoped tool call</text>
  <line x1="1235" y1="921" x2="1290" y2="921" stroke="#34a853" stroke-width="2.5"/><text class="small" x="1303" y="926">User-value delivery</text>
  <line x1="1235" y1="951" x2="1290" y2="951" stroke="#4285f4" stroke-width="2.2"/><text class="small" x="1303" y="956">FCM notice</text>
  <text class="small" x="70" y="1025">Detailed agent topology, barriers, and service cards are kept in architecture-detailed.svg.</text>
</svg>
