  <use href="#braces" x="442" y="283" width="29" height="29"/><text class="h3" x="487" y="281">Pub/Sub background stages</text><text class="t" x="487" y="307">independent retries · OIDC push</text><text class="small" x="487" y="328">dead-letter topics · replay-safe stage work</text>
